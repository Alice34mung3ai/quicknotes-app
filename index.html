<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Quick Notes</h1>
        <p>Capture your thoughts, keep them close.</p>
    </header>

    <main>
        <section aria-labelledby="add-note-heading">
            <h2 id="add-note-heading">Add a note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note</label>
                    <input type="text" id="note-input" name="note">
                </div>

                <div class="form-group">
                    <label for="note-category">Category</label>
                    <select id="note-category" name="category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit">Add Note</button>
            </form>
            <p id="error-message" role="alert"></p>
        </section>

        <section aria-labelledby="your-notes-heading">
            <h2 id="your-notes-heading">Your notes</h2>
            <label for="search-input">Search notes</label>
            <input type="search" id="search-input" name="search" placeholder="Search notes">
            <p id="note-count">0 notes</p>
            <button  type="button" id="clear-all">Clear all</button>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Quick Notes</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
